name: Build, Push Docker Image

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PLATFORM: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set build variables
        id: build-vars
        run: |
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          REPO_URL="https://github.com/${{ github.repository }}"

          echo "BUILD_TIME=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "REPO_URL=${REPO_URL}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
          labels: |
            maintainer=${{ github.actor }}
            org.opencontainers.image.title=WebhookFanout
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=WebhookFanout - A simple webhook fanout service built with Go
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.authors=${{ github.actor }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./compose.yml
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-tags }}
            cwd://${{ steps.meta.outputs.bake-file-labels }}
            cwd://${{ steps.meta.outputs.bake-file-annotations }}
          targets: release
          push: true
          provenance: true
          sbom: true
          set: |
            release.platform=${{ env.PLATFORM }}
            release.args.APP_VERSION=${{ github.sha }}
            release.args.BUILD_TIME=${{ steps.build-vars.outputs.BUILD_TIME }}
            release.args.REPO_URL=${{ steps.build-vars.outputs.REPO_URL }}
